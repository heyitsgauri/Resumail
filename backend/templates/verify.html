<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex items-center justify-center">
    <div class="bg-white rounded-lg shadow-xl p-8 max-w-md w-full">
        <h2 class="text-3xl font-bold text-gray-800 mb-6 text-center">Verify Your Email</h2>
        
        <p class="text-sm text-gray-600 mb-6 text-center">
            We've sent a 6-digit verification code to <br><span class="font-semibold text-gray-800">{{ email }}</span>
        </p>

        {% if error %}
            <div class="mb-4 p-3 bg-red-50 border border-red-200 rounded-lg">
                <p class="text-red-700 text-sm">{{ error }}</p>
            </div>
        {% endif %}

        <form method="post" action="/verify-otp" class="space-y-4">
            <!-- Hidden field for email so the backend knows who to verify -->
            <input type="hidden" name="email" value="{{ email }}">
            
            <div>
                <label for="otp" class="block text-sm font-medium text-gray-700 mb-2">Verification Code</label>
                <input 
                    type="text" 
                    id="otp"
                    name="otp" 
                    required
                    placeholder="123456"
                    maxlength="6"
                    pattern="\d{6}"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg tracking-widest text-center text-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                >
            </div>

            <button 
                type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-lg transition duration-200"
            >
                Verify and Login
            </button>
        </form>

        <p class="mt-4 text-center text-gray-600 text-sm">
            Didn't receive the code? 
            <a href="/register" class="text-blue-600 hover:text-blue-800 underline">Register again</a>
        </p>
    </div>
</body>
</html>
